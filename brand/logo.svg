<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="Сорока с находкой в клюве">
  <title>Сорока</title>
  <!-- Оригинальная работа для бота «Сорока»: геометрия нарисована с нуля,
       заимствований нет. Сорока в профиль — длинный ступенчатый хвост её
       главная примета. В клюве находка, ради которой всё и затевалось.
       Цвета те же, что в анкете: белый фон, почти чёрный, один тёплый акцент. -->

  <circle cx="256" cy="256" r="256" fill="#FFFFFF"/>

  <!-- птица целиком: вписана в круг с запасом, чтобы хвост не срезался -->
  <g transform="translate(256 256) scale(0.84) translate(-282 -296)">
  <g fill="#111113">
    <!-- хвост: широкий у корпуса, к концу сходится на нет -->
    <path d="M232 292
             C 196 322 140 378 86 438
             C 82 442 84 449 90 449
             L 133 449
             C 168 404 214 349 252 316 Z"/>

    <!-- корпус и шея одной каплей: широкая грудь, плавный переход к голове -->
    <path d="M214 316
             C 176 278 182 218 226 186
             C 262 160 306 160 336 178
             C 358 191 366 214 358 236
             C 348 262 322 278 292 292
             C 266 304 238 314 214 316 Z"/>

    <!-- голова -->
    <circle cx="344" cy="186" r="43"/>

    <!-- клюв -->
    <path d="M382 172 L 446 186 L 382 200 Z"/>
  </g>

  <!-- светлое оперение груди: узкая долька вдоль корпуса, а не дырка посередине -->
  <path d="M236 292
           C 214 268 220 232 248 210
           C 262 226 258 262 236 292 Z"
        fill="#FFFFFF"/>

  <!-- глаз -->
  <circle cx="358" cy="176" r="6" fill="#FFFFFF"/>

  <!-- находка -->
  <circle cx="464" cy="186" r="15" fill="#D99A2B"/>
  </g>
</svg>
