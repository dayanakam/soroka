<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мой стиль</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#FFFFFF;
  --ink:#111113;
  --muted:#8E8E93;
  --line:#E8E8EA;
  --fill:#F5F5F7;
  --accent:#111113;
  --accent-ink:#FFFFFF;
  font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
              Roboto, "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box}
img{max-width:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-size:15px;
  line-height:1.4;
  -webkit-font-smoothing:antialiased;
  padding-bottom:88px;
}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

h1{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:24px 0 20px}

section{padding:26px 0;border-top:1px solid var(--line)}
section:first-of-type{border-top:none;padding-top:0}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
h2{font-size:15px;font-weight:600;letter-spacing:-.01em;margin:0}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

/* стили */
.styles{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.pick{
  position:relative;display:block;width:100%;padding:0;border:none;background:none;
  font:inherit;color:inherit;text-align:left;cursor:pointer;
}
.pick .shot{
  display:block;aspect-ratio:3/4;overflow:hidden;border-radius:10px;
  background:var(--fill);border:1.5px solid transparent;transition:border-color .15s;
}
.pick .shot img{width:100%;height:100%;object-fit:cover;display:block}
.pick[aria-pressed="true"] .shot{border-color:var(--accent)}
.pick:focus-visible .shot{outline:2px solid var(--accent);outline-offset:2px}
.styles.at-max .pick[aria-pressed="false"]{opacity:.4}
.nm{display:block;font-size:13px;font-weight:500;margin-top:7px;letter-spacing:-.01em}
.tick{
  position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;
  background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;
  font-size:12px;transform:scale(.5);opacity:0;transition:.15s;
}
.pick[aria-pressed="true"] .tick{transform:scale(1);opacity:1}

/* чипы */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  font:inherit;font-size:14px;color:inherit;cursor:pointer;
  background:var(--fill);border:1.5px solid transparent;border-radius:9px;
  padding:8px 13px;transition:.15s;
}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.veto .chip[aria-pressed="true"]{background:var(--fill);color:var(--muted);border-color:var(--line);text-decoration:line-through}

/* размеры */
.fields{display:grid;gap:16px}
.lbl{font-size:13px;color:var(--muted);display:block;margin-bottom:7px}
.field .chip{padding:7px 12px;font-variant-numeric:tabular-nums;min-width:44px;text-align:center}

/* бюджет */
.val{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;background:none;height:24px;margin:0;display:block}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--line);border-radius:3px}
input[type=range]::-moz-range-track{height:3px;background:var(--line);border-radius:3px}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:22px;height:22px;border-radius:50%;
  background:var(--bg);border:1.5px solid var(--accent);margin-top:-10px;
  box-shadow:0 1px 3px rgba(0,0,0,.18);cursor:grab;
}
input[type=range]::-moz-range-thumb{
  width:22px;height:22px;border-radius:50%;background:var(--bg);
  border:1.5px solid var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.18);cursor:grab;
}

/* низ */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding-top:12px;padding-bottom:12px}
.status{flex:1;font-size:13px;color:var(--muted);min-width:0}
.save{
  font:inherit;font-size:15px;font-weight:500;white-space:nowrap;
  background:var(--accent);color:var(--accent-ink);border:none;border-radius:10px;
  padding:12px 22px;cursor:pointer;
}
.save[disabled]{opacity:.3}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<main class="wrap">
  <h1>Мой стиль</h1>

  <section>
    <div class="head"><h2>Стили</h2><span class="count" id="styleCount"></span></div>
    <div class="styles" id="styles"></div>
  </section>

  <section>
    <div class="head"><h2>Категории</h2><span class="count" id="catCount"></span></div>
    <div class="chips" id="cats"></div>
  </section>

  <section>
    <div class="head"><h2>Размеры</h2></div>
    <div class="fields" id="sizes"></div>
  </section>

  <section>
    <div class="head"><h2>Бюджет</h2><span class="val" id="valRange"></span></div>
    <input type="range" id="budMin" min="0" max="60000" step="500" value="1500" aria-label="Нижняя граница">
    <input type="range" id="budMax" min="0" max="60000" step="500" value="25000" aria-label="Верхняя граница">
    <div class="chips" id="disc" style="margin-top:16px"></div>
  </section>

  <section class="veto">
    <div class="head"><h2>Не присылать</h2></div>
    <div class="chips" id="veto"></div>
  </section>
</main>

<div class="bar">
  <div class="wrap">
    <span class="status" id="status"></span>
    <button class="save" id="save">Сохранить</button>
  </div>
</div>

const MAX_STYLES = 5;

const state = {
  styles: [],
  categories: CATS.map(c => c[0]),
  sizes: { top:"M", bottom:"46", jeans:"28", shoes:"38" },
  budgetMin: 1500,
  budgetMax: 25000,
  minDiscount: "any",
  veto: []
};

const $ = id => document.getElementById(id);
const rub = n => n.toLocaleString("ru-RU") + " ₽";

function toggle(list, value){
  const i = list.indexOf(value);
  if (i === -1) list.push(value); else list.splice(i, 1);
}

/* ---------- build: styles ---------- */
function buildStyles(){
  $("styles").innerHTML = STYLES.map(s => `
    <button class="pick" type="button" data-id="${s.id}" aria-pressed="false">
      <span class="shot"><img src="${s.img}" alt="" loading="lazy" decoding="async"></span>
      <span class="tick" aria-hidden="true">&#10003;</span>
      <span class="nm">${s.name}</span>
    </button>`).join("");

  $("styles").addEventListener("click", e => {
    const btn = e.target.closest(".pick");
    if (!btn) return;
    const id = btn.dataset.id;
    if (!state.styles.includes(id) && state.styles.length >= MAX_STYLES) return;
    toggle(state.styles, id);
    paint();
  });
}

/* ---------- build: chip groups ---------- */
function buildChips(host, items, isOn, onPick, ghost){
  host.innerHTML = items.map(([val, label]) =>
    `<button class="chip${ghost ? " ghost" : ""}" type="button" data-v="${val}" aria-pressed="${isOn(val)}">${label}</button>`
  ).join("");
  host.addEventListener("click", e => {
    const c = e.target.closest(".chip");
    if (!c) return;
    onPick(c.dataset.v);
    paint();
  });
}

function buildSizes(){
  $("sizes").innerHTML = SIZE_FIELDS.map(f => `
    <div class="field">
      <span class="lbl">${f.label}</span>
      <div class="chips" data-size="${f.id}">
        ${f.opts.map(o => `<button class="chip" type="button" data-v="${o}" aria-pressed="false">${o}</button>`).join("")}
      </div>
    </div>`).join("");

  $("sizes").addEventListener("click", e => {
    const c = e.target.closest(".chip");
    if (!c) return;
    state.sizes[c.parentElement.dataset.size] = c.dataset.v;
    paint();
  });
}

/* ---------- paint ---------- */
function paint(){
  // styles
  const atMax = state.styles.length >= MAX_STYLES;
  $("styles").classList.toggle("at-max", atMax);
  $("styles").querySelectorAll(".pick").forEach(b =>
    b.setAttribute("aria-pressed", state.styles.includes(b.dataset.id)));
  $("styleCount").textContent = `${state.styles.length} / ${MAX_STYLES}`;

  // categories
  $("cats").querySelectorAll(".chip").forEach(c =>
    c.setAttribute("aria-pressed", state.categories.includes(c.dataset.v)));
  $("catCount").textContent = `${state.categories.length} / ${CATS.length}`;

  // sizes
  $("sizes").querySelectorAll(".chips").forEach(group => {
    const cur = state.sizes[group.dataset.size];
    group.querySelectorAll(".chip").forEach(c =>
      c.setAttribute("aria-pressed", c.dataset.v === cur));
  });

  // budget
  $("budMin").value = state.budgetMin;
  $("budMax").value = state.budgetMax;
  $("valRange").textContent = state.budgetMax >= 60000
    ? "от " + rub(state.budgetMin)
    : rub(state.budgetMin) + " — " + rub(state.budgetMax);
  $("disc").querySelectorAll(".chip").forEach(c =>
    c.setAttribute("aria-pressed", c.dataset.v === state.minDiscount));

  // veto
  $("veto").querySelectorAll(".chip").forEach(c =>
    c.setAttribute("aria-pressed", state.veto.includes(c.dataset.v)));

  const ready = state.styles.length >= 1;
  $("save").disabled = !ready;
  if (tg){
    ready ? tg.MainButton.enable() : tg.MainButton.disable();
    tg.MainButton.setText(ready
      ? `Сохранить · ${state.styles.length} ${state.styles.length === 1 ? "стиль" : "стиля"}`
      : "Выбери стиль");
  }
}

/* ---------- сохранение: напрямую через Telegram ---------- */
/* Страница статическая: она не ходит ни на какой сервер.
   Текущий профиль прилетает в адресной строке, ответ уходит через
   Telegram.WebApp.sendData — его получает сам бот. */
const tg = window.Telegram && window.Telegram.WebApp;

function say(msg, ok){
  const el = $("status");
  el.textContent = msg;
  el.classList.toggle("ok", !!ok);
}

function readIncoming(){
  /* Компактный формат из бота: s=стили&c=маска категорий&z=размеры
     &b=бюджет&d=порог скидки&v=маска стоп-листа.
     Порядок списков должен совпадать с bot/styles.py. */
  const q = new URLSearchParams(location.hash.replace(/^#/, ""));
  if (![...q.keys()].length) return null;

  const unmask = (raw, order) => {
    const n = parseInt(raw, 10);
    if (!Number.isFinite(n)) return null;
    return order.filter((_, i) => n & (1 << i));
  };

  const out = {};
  if (q.has("s")) out.styles = q.get("s").split(",").filter(Boolean);
  if (q.has("c")) out.categories = unmask(q.get("c"), CATS.map(c => c[0]));
  if (q.has("v")) out.veto = unmask(q.get("v"), VETO);
  if (q.has("z")){
    const [top, bottom, jeans, shoes] = q.get("z").split("-");
    out.sizes = {};
    if (top) out.sizes.top = top;
    if (bottom) out.sizes.bottom = bottom;
    if (jeans) out.sizes.jeans = jeans;
    if (shoes) out.sizes.shoes = shoes;
  }
  if (q.has("b")){
    const [lo, hi] = q.get("b").split("-");
    if (lo !== undefined && lo !== "") out.budgetMin = +lo;
    if (hi === "max") out.budgetMax = 1e9;
    else if (hi !== undefined && hi !== "") out.budgetMax = +hi;
  }
  if (q.has("d")) out.minDiscount = q.get("d");
  return out;
}

let saving = false;
function save(){
  if (saving) return;
  if (state.styles.length < 1){ say("Выбери стиль"); return; }
  if (!tg || !tg.sendData){
    say("Только внутри Telegram");
    return;
  }
  saving = true;
  say("Сохраняю…");
  try {
    tg.sendData(JSON.stringify({
      styles: state.styles,
      categories: state.categories,
      sizes: state.sizes,
      budgetMin: state.budgetMin,
      budgetMax: state.budgetMax >= 60000 ? 1e9 : state.budgetMax,
      minDiscount: state.minDiscount,
      veto: state.veto
    }));
    // Telegram закроет окно сам, как только заберёт данные
  } catch (e) {
    saving = false;
    say("Не удалось отправить");
  }
}

function connect(){
  const saved = readIncoming();
  if (!saved) return;
  if (Array.isArray(saved.styles))     state.styles     = saved.styles.slice(0, MAX_STYLES);
  if (Array.isArray(saved.categories)) state.categories = saved.categories;
  if (Array.isArray(saved.veto))       state.veto       = saved.veto;
  if (saved.sizes) Object.assign(state.sizes, saved.sizes);
  if (typeof saved.budgetMin === "number") state.budgetMin = saved.budgetMin;
  if (typeof saved.budgetMax === "number") state.budgetMax = saved.budgetMax;
  if (typeof saved.minDiscount === "string") state.minDiscount = saved.minDiscount;
  paint();
  if (state.styles.length) say("");
}

/* ---------- Telegram ---------- */
if (tg){
  tg.ready();
  tg.expand();
  const theme = () => document.documentElement.setAttribute("data-theme",
    tg.colorScheme === "dark" ? "dark" : "light");
  theme();
  tg.onEvent("themeChanged", theme);
  tg.MainButton.setText("Сохранить профиль");
  tg.MainButton.onClick(save);
  tg.MainButton.show();
} else {
  say("Открой через бота");
}

/* ---------- init ---------- */
buildStyles();
buildSizes();
buildChips($("cats"), CATS, v => state.categories.includes(v), v => toggle(state.categories, v));
buildChips($("disc"), DISCOUNTS, v => v === state.minDiscount, v => { state.minDiscount = v; }, true);
buildChips($("veto"), VETO.map(v => [v, v]), v => state.veto.includes(v), v => toggle(state.veto, v));

$("budMin").addEventListener("input", e => {
  state.budgetMin = Math.min(+e.target.value, state.budgetMax - 500);
  paint();
});
$("budMax").addEventListener("input", e => {
  state.budgetMax = Math.max(+e.target.value, state.budgetMin + 500);
  paint();
});
$("save").addEventListener("click", save);

paint();
connect();
</script>
</body>
</html>
